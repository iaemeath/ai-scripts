<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>时间工具</title>
  <link rel="stylesheet" href="vendor/element-plus.css">
  <link rel="stylesheet" href="vendor/element-plus-dark.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <div class="calendar-panel" id="calendar-panel">
      <!-- 工具条：左 翻时段+日期选择 | 右 新增/月/导入导出/深浅色 -->
      <!-- 工具条（三列 grid：左空 | 中 翻时段+日期选择 | 右 月/导入导出/深浅色） -->
      <header class="toolbar">
        <div class="toolbar__left"></div>
        <div class="toolbar__center">
          <button id="btn-prev" class="icon-btn" title="上一时段" aria-label="上一时段">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <!-- EP 日期选择器挂载点（daterange/month 由 js/calendar.js 按模式切换渲染） -->
          <div id="picker-mount" class="picker-mount"></div>
          <button id="btn-next" class="icon-btn" title="下一时段" aria-label="下一时段">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button id="btn-today" class="today-btn hidden" title="回到今天（T）">今</button>
        </div>
        <div class="toolbar__right">
          <button id="btn-month" class="text-btn" title="月视图（3）">月</button>
          <button id="btn-import" class="icon-btn" title="导入 JSON" aria-label="导入 JSON">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </button>
          <button id="btn-export" class="icon-btn" title="导出 JSON" aria-label="导出 JSON">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button id="btn-theme" class="icon-btn" title="切换深浅色（D）" aria-label="切换深浅色">
            <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg id="icon-moon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </header>
      <div id="calendar" class="calendar-host"></div>
    </div>
  </div>

  <!-- 日程新增/编辑弹窗 -->
  <dialog id="dlg-schedule" class="dlg dlg-schedule">
    <h2 id="dlg-heading">新增日程</h2>
    <div class="form">
      <label class="field"><span class="field__label">标题</span>
        <input id="f-title" type="text" maxlength="100" placeholder="请输入日程标题">
      </label>
      <label class="field"><span class="field__label">描述</span>
        <textarea id="f-desc" rows="2" maxlength="200" placeholder="日程描述（可选）"></textarea>
      </label>
      <div class="field-row">
        <label class="field"><span class="field__label">日期</span><input id="f-date" type="date"></label>
        <label class="field"><span class="field__label">开始</span><input id="f-start" type="time"></label>
        <label class="field"><span class="field__label">结束</span><input id="f-end" type="time"></label>
      </div>
      <div class="field"><span class="field__label">颜色</span><div id="f-color" class="color-row"></div></div>
    </div>
    <footer class="dlg-footer">
      <button id="f-delete" class="btn btn--danger hidden">删除</button>
      <span class="spacer"></span>
      <button id="f-cancel" class="btn">取消</button>
      <button id="f-save" class="btn btn--primary">创建</button>
    </footer>
  </dialog>

  <!-- 确认弹窗 -->
  <dialog id="dlg-confirm" class="dlg dlg-confirm">
    <h2 id="confirm-title">确认</h2>
    <p id="confirm-message" class="confirm-message"></p>
    <footer class="dlg-footer">
      <span class="spacer"></span>
      <button id="confirm-cancel" class="btn">取消</button>
      <button id="confirm-ok" class="btn btn--primary">确定</button>
    </footer>
  </dialog>

  <!-- 快捷键帮助 -->
  <dialog id="dlg-help" class="dlg dlg-help">
    <h2>键盘快捷键</h2>
    <div class="help-groups">
      <section>
        <h3>日历</h3>
        <div class="help-row"><span>回到今天</span><span class="keys"><kbd>T</kbd></span></div>
        <div class="help-row"><span>新建日程</span><span class="keys"><kbd>C</kbd></span></div>
        <div class="help-row"><span>上一 / 下一时段</span><span class="keys"><kbd>←</kbd><kbd>→</kbd></span></div>
        <div class="help-row"><span>单日 / 周区间 / 月视图</span><span class="keys"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></span></div>
        <div class="help-row"><span>复制选中日程到后一天</span><span class="keys"><kbd>Ctrl</kbd><kbd>V</kbd></span></div>
        <div class="help-row"><span>删除选中日程（可撤销）</span><span class="keys"><kbd>Del</kbd></span></div>
        <div class="help-row"><span>取消选中</span><span class="keys"><kbd>Esc</kbd></span></div>
      </section>
      <section>
        <h3>通用</h3>
        <div class="help-row"><span>深浅色切换</span><span class="keys"><kbd>D</kbd></span></div>
        <div class="help-row"><span>本页帮助</span><span class="keys"><kbd>?</kbd></span></div>
      </section>
    </div>
    <footer class="dlg-footer"><span class="help-hint">按 <kbd>?</kbd> 随时呼出本页 · 仅桌面端生效</span></footer>
  </dialog>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <!-- 视觉隐藏（不用 display:none/hidden：部分浏览器拦截对不可见文件输入的编程点击） -->
  <input type="file" id="import-file" accept=".json,application/json" class="sr-file-input">

  <!-- EP 日期选择器依赖（Vue 全局构建 → Element Plus 全量 → 中文语言包；顺序不可换） -->
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/element-plus.full.min.js"></script>
  <script src="vendor/element-plus-locale-zh-cn.min.js"></script>

  <!-- FullCalendar 全局构建（经典脚本，file:// 可用；顺序：core → interaction → daygrid → timegrid → 语言包） -->
  <script src="vendor/fullcalendar-core.global.min.js"></script>
  <script src="vendor/fullcalendar-interaction.global.min.js"></script>
  <script src="vendor/fullcalendar-daygrid.global.min.js"></script>
  <script src="vendor/fullcalendar-timegrid.global.min.js"></script>
  <script src="vendor/fullcalendar-locale-zh-cn.global.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/date.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/swipe.js"></script>

  <script>
    /* store.js 在模块内自加载；其余按依赖顺序装配 */
    TTUI.init()
    TTCal.init()
    TTShortcuts.init()
    TTSwipe.init()
  </script>
</body>
</html>
