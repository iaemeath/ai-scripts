# ai-scripts 便携单 exe 打包配置（npm run app:dist）
# 产物：release/ai-scripts-portable.exe（免安装，双击即用；每次启动自解压到临时目录）
appId: dev.cly.ai-scripts
productName: ai-scripts
# asar 关闭：electron 43 下完整性校验触发 STATUS_BREAKPOINT 崩溃（实测），且 asar 虚拟
# 文件系统还带来 ESM 解析怪癖；个人工具不需要 asar 保护，真实文件系统最稳
asar: false
# 本机无外网：直接用 node_modules/electron/dist（已从本地缓存 zip 解压），跳过 electron 下载
electronDist: node_modules/electron/dist
directories:
  output: release
# 进 asar 的应用体：主进程 + server bundle + 前端构建产物（Electron 的 fs 补丁可直读 asar）
files:
  - electron/main.cjs
  - electron/server.mjs
  - web/dist/**/*
# 卡片不随包分发（2026-10-22 起废除内置卡片）：唯一工具根 = 运行机 ~/.ai-scripts
extraResources:
  # 卡片运行时：裸 node.exe（从本机 nodejs 安装拷贝）。卡片启动时 procman 把它前插进
  # PATH——发到没装 Node 的机器上，`node xxx.cjs` 类卡片命令照样能跑
  - from: build/node-runtime
    to: node-runtime
win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # 签名走构建后手动步骤（app:dist 之后执行 sign-exe.ps1）：
  # electron-builder 的 signtool 联网下载在本机不可用；Set-AuthenticodeSignature + 自签证书
  # （Cert:\CurrentUser\My，CN=ai-scripts-dev，已导入本机 Root/TrustedPeople）等效且离线
portable:
  artifactName: ai-scripts-portable.exe
